name: Church Love YouTube Daily Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: YouTube search and update
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/youtube_update.py

      - name: Commit changes
        run: |
          git config user.name "church-love-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.json
          if git diff --cached --quiet; then
            echo "No new videos."
          else
            git commit -m "daily: add YouTube videos"
            git push
          fi
