name: Church Love Daily DB Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update up to 100 songs
        run: python scripts/daily_update.py

      - name: Commit and push
        run: |
          git config user.name "church-love-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.json update_queue.json update_log.json
          if git diff --cached --quiet; then
            echo "No new songs."
          else
            git commit -m "daily: update up to 100 songs"
            git push
          fi
