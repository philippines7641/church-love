name: Church Love Daily Verified Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add only verified videos (0 to 100/day)
        run: python scripts/daily_update.py

      - name: Commit and push if changed
        run: |
          git config user.name "church-love-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.json update_queue.json update_log.json
          if git diff --cached --quiet; then
            echo "No newly verified songs."
          else
            git commit -m "daily: add verified accompaniment videos"
            git push
          fi
